<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://www.planet-pooch.com/">
<meta name="theme-color" content="#102021">
<title>Planet Pooch | Mobile Grooming &amp; Pet Resort</title>
<style>
@font-face{font-family:Instrument;src:url("/assets/InstrumentSerif-Italic.ttf") format("truetype");font-style:italic;font-display:swap}
*{box-sizing:border-box}
:root{--cream:#fff8e9;--mint:#cdf0cf;--inset:clamp(24px,5vw,96px)}
body{margin:0;background:#101b1a;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
main{position:relative;isolation:isolate;display:grid;grid-template-rows:auto 1fr auto;min-height:100svh;overflow:hidden}
.scene,.shade{position:absolute;inset:0;z-index:-1;pointer-events:none}
.scene{overflow:hidden;background:#132220}
.scene img{width:84%;height:100%;position:absolute;right:0;object-fit:cover;object-position:50% 41%;filter:saturate(.82);mask-image:linear-gradient(90deg,transparent,#000 29%);animation:reveal 3.8s ease-out both}
@keyframes reveal{from{transform:scale(1.045)}to{transform:scale(1)}}
.shade{background:linear-gradient(90deg,rgba(9,23,23,.79),rgba(11,23,22,.32) 43%,transparent 68%),linear-gradient(0deg,rgba(7,18,18,.93),transparent 40%,transparent 82%,rgba(6,18,16,.5))}
header{margin:0 var(--inset);padding:25px 0 19px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff48}
header img{display:block;width:clamp(120px,12vw,181px);height:auto;filter:brightness(0) invert(96%)}
header span{font-size:.75rem;letter-spacing:.08em}
.intro{align-self:center;padding:52px var(--inset) 64px}
h1{font-size:clamp(4.6rem,8.8vw,11rem);letter-spacing:-.085em;font-weight:500;margin:0;line-height:.91}
h1 em{display:block;font-family:Instrument,Georgia,serif;font-weight:400;letter-spacing:-.045em;color:var(--mint);font-size:1.23em;line-height:.99}
nav{display:grid;grid-template-columns:1fr 1fr;background:rgba(14,29,28,.68);backdrop-filter:blur(18px);border-top:1px solid #ffffff60}
a{color:inherit;text-decoration:none;display:grid;grid-template-columns:1fr auto;align-content:center;align-items:center;gap:8px 15px;padding:clamp(20px,2.5vw,39px) var(--inset);transition:background .25s}
a+a{border-left:1px solid #ffffff48}
strong{font-size:clamp(1.5rem,2.9vw,3.25rem);letter-spacing:-.055em;font-weight:500}
small{grid-column:1;font-size:clamp(.82rem,1.1vw,1rem);line-height:1.45;color:#edece0}
.arrow{grid-row:1/3;grid-column:2;display:grid;place-items:center;width:40px;aspect-ratio:1;border:1px solid #ffffff82;border-radius:50%;font-size:22px;transition:background .2s,color .2s,transform .2s}
a:hover,a:focus-visible{background:#c1dec119}
a:is(:hover,:focus-visible) .arrow{color:#132220;background:var(--mint);transform:translateX(3px)}
a:focus-visible{outline:3px solid var(--mint);outline-offset:-5px}
@media(max-width:680px){
header{padding:19px 0 14px}header span{font-size:.68rem}
.scene img{width:100%;height:80%;object-position:53% 20%;mask-image:none}
.shade{background:linear-gradient(0deg,#101c1c 12%,rgba(12,25,24,.88) 29%,transparent 66%),linear-gradient(180deg,rgba(10,23,21,.65),transparent 25%)}
.intro{align-self:end;padding:clamp(190px,30svh,320px) var(--inset) 25px}
h1{font-size:clamp(3.6rem,13vw,5.6rem);text-shadow:0 2px 26px #101b1a65}
nav{grid-template-columns:1fr;background:#122423e0}
a{padding:15px var(--inset);gap:4px 12px}
a+a{border-left:0;border-top:1px solid #ffffff40}
strong{font-size:1.6rem}small{font-size:.82rem}.arrow{width:34px}
}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<div class="scene" aria-hidden="true"><img src="/assets/portrait.webp" alt="" fetchpriority="high"></div><div class="shade"></div>
<header><img src="/assets/logo.png" alt="Planet Pooch"><span>Long Island, New York</span></header>
<section class="intro"><h1>Enriching the <em>lives of pets.</em></h1></section>
<nav aria-label="Choose your Planet Pooch destination">
<a href="/grooming/"><strong>Mobile Grooming</strong><small>One-on-one grooming at your doorstep</small><span class="arrow" aria-hidden="true">→</span></a>
<a href="https://planetpoochresorts.com/resort/"><strong>Pet Resort</strong><small>Daycare, boarding, in-house grooming &amp; training</small><span class="arrow" aria-hidden="true">→</span></a>
</nav></main></body></html>
