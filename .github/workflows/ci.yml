name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check inquiry feedback without network delivery
        run: node scripts/check-form-feedback.cjs

      - name: Build public pages
        run: npm run build

      - name: Check page accessibility structure
        run: npm run check:a11y:structure

      - name: Check measured form contrast
        run: npm run check:a11y:contrast

      # Static checks exclude visual rendering and interactive states.
      # Passing CI does not establish full WCAG conformance.
      - name: Check static accessibility semantics
        run: npm run check:a11y:semantics
